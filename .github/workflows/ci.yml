name: CI - Verificação de Build v2.0

on:
  push:
    branches: ["main", "v2.0"]
  pull_request:
    branches: ["main", "v2.0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Executar verificação de tipos e compilação
        run: npm run build
